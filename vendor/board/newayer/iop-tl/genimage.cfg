# genimage.cfg
image boot.vfat {
    vfat {
        files = {
            "zImage"
        }
        file imx6ul-14x14-evk.dtb {
            image = "my-imx6ull-emmc-iop.dtb"
        }
    }
    size = 16M
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
    }

    size = 4G

    # U-Boot 裸数据，不参与分区表
    partition u-boot {
        in-partition-table = "no"
        image = "u-boot.imx"
        offset = 1024
    }

    # boot 分区（FAT32），存放 kernel 和 dtb
    partition boot {
        partition-type = 0xC
        bootable = true
        image = "boot.vfat"
        offset = 10M
    }

    # rootfs 分区（ext4）
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
        offset = 30M
        size = 384M
    }

    # 空闲分区：自动占满剩余空间
    partition free {
        partition-type = 0x83
        autoresize = true
    }
}