flash nand-256M {
    pebsize = 0x20000
    lebsize = 0x1F000
    numpebs = 2048
    minimum-io-unit-size = 0x800
    vid-header-offset = 0x800
    sub-page-size = 0x800
}

image nand-full.img {
    flash { }
    flashtype = "nand-256M"

    partition uboot {
        image = "u-boot.imx"
        size = 8M
    }
    partition kernel {
        image = "zImage"
        size = 8M
    }
    partition dtb {
        image = "my-imx6ull-nand-iop.dtb"
        size = 1M
    }
    partition rootfs {
        image = "rootfs.ubi"
        size = 80M
    }
    partition free {
        size = 0
    }
}
