interface=br-lan
interface=eth0

dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,24h
dhcp-range=192.168.10.100,192.168.10.200,255.255.255.0,24h

dhcp-option=tag:br-lan,option:router,192.168.1.1
dhcp-option=tag:br-lan,option:dns-server,192.168.1.1

dhcp-option=tag:eth0,option:router,192.168.10.1
dhcp-option=tag:eth0,option:dns-server,192.168.10.1
